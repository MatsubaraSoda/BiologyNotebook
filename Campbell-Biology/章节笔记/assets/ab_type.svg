\definecolor{brickred}{RGB}{214, 106, 106}
\definecolor{darkcenter}{RGB}{168, 62, 62}
\definecolor{softgold}{RGB}{240, 208, 120}
\begin{document}
\begin{tikzpicture}
\useasboundingbox (0,0) circle (3.6cm);
% outer ring: lighter brick red
\fill[brickred] (0,0) circle (3cm);
% inner disc: darker red-brown (central depression)
\fill[darkcenter] (0,0) circle (1.5cm);

% 12 antigens total, perfectly staggered, no overlap:
%   6 IA triangles starting at   0 deg, step 60
%   6 IB circles   starting at  30 deg, step 60
% (two separate loops instead of one loop with +30 offset,
%  which made the last circle land on top of the first triangle)
\foreach \a in {0,60,...,300} {
    % IA antigen (triangle)
    \begin{scope}[rotate=\a, shift={(3cm,0)}]
        \fill[softgold, draw=orange!80!black, line width=0.6pt]
            (-0.1, -0.35) -- (0.3, 0) -- (-0.1, 0.35) -- cycle;
    \end{scope}
}
\foreach \a in {30,90,...,330} {
    % IB antigen (circle)
    \begin{scope}[rotate=\a, shift={(3cm,0)}]
        \fill[softgold, draw=orange!80!black, line width=0.6pt]
            (0.05, 0) circle (0.25cm);
    \end{scope}
}
\end{tikzpicture}
\end{document}
