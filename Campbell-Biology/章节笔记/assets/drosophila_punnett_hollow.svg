<svg version='1.1' xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='179.878pt' height='290.471pt' viewBox='0 0 179.878 290.471'><metadata><latex-source xmlns="https://matsubarasoda.com/ns/latex-source">% Morgan's Drosophila P cross -&gt; F1 Punnett square: red-eyed female x white-eyed male.
% Variant: wild-type w+ in red, mutant w hollow (white fill + black contour), transparent background.
% Pitfall: contour package may not survive the dvisvgm route -- verify visually.
\documentclass[tikz,border=10pt]{standalone}
\usepackage{lmodern}
\usepackage{xcolor}
\usepackage{contour}

\contourlength{0.015em}
% hollow w: white glyph with thin black outline
\newcommand{\holloww}{\contour{black}{\textcolor{white}{$\scriptstyle w$}}}

\begin{document}
\begin{tikzpicture}[
    cellw/.store in=\cellw, cellw=2.2,
    cellh/.store in=\cellh, cellh=2.2
]

% ---- gamete headers (products of meiosis); no frames ----

% sperm from the white-eyed male (P sire), one above each column
\node at (1.1,0.5) {$X^{\holloww}$};
\node at (3.3,0.5) {$Y$};

% egg from the red-eyed female (P dam), left of the single row
\node[anchor=east] at (-0.25,-1.1) {$X^{\textcolor{red}{w^+}}$};

% ---- the two F1 offspring cells ----

\node at (1.1,-1.1) {$X^{\textcolor{red}{w^+}}X^{\holloww}$};   % red-eyed female
\node at (3.3,-1.1) {$X^{\textcolor{red}{w^+}}Y$};        % red-eyed male

% ---- table lines: outer rectangle + the one inner divider, drawn by hand ----

\draw (0,0) rectangle (4.4,-2.2);
\draw (2.2,0) -- (2.2,-2.2);

% =====================================================================
% F1 intercross -&gt; F2: 2x2 Punnett square below the P table.
% Sperm (F1 male X^{w+}Y) on top, eggs (F1 female X^{w+}X^{w}) on the left.
% Vertical gap of 2.2cm separates the two tables.

% ---- gamete headers ----

\node at (1.1,-3.9) {$X^{\textcolor{red}{w^+}}$};   % sperm, column 1
\node at (3.3,-3.9) {$Y$};         % sperm, column 2
\node[anchor=east] at (-0.25,-5.5) {$X^{\textcolor{red}{w^+}}$};   % egg, row 1
\node[anchor=east] at (-0.25,-7.7) {$X^{\holloww}$};      % egg, row 2

% ---- the four F2 offspring cells ----

\node at (1.1,-5.5) {$X^{\textcolor{red}{w^+}}X^{\textcolor{red}{w^+}}$};   % red-eyed female
\node at (3.3,-5.5) {$X^{\textcolor{red}{w^+}}Y$};          % red-eyed male
\node at (1.1,-7.7) {$X^{\textcolor{red}{w^+}}X^{\holloww}$};      % red-eyed female
\node at (3.3,-7.7) {$X^{\holloww}Y$};            % white-eyed male

% ---- table lines: outer rectangle + inner dividers, drawn by hand ----

\draw (0,-4.4) rectangle (4.4,-8.8);   % 2 rows x 2 columns
\draw (2.2,-4.4) -- (2.2,-8.8);
\draw (0,-6.6) -- (4.4,-6.6);

\end{tikzpicture}
\end{document}
