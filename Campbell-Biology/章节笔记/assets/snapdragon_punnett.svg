\usepackage{tikz}

% Snapdragon (金鱼草) incomplete dominance
% Cross: C^R C^W (pink) x C^R C^W (pink)
% F2 genotypes 1 RR : 2 RW : 1 WW -&gt; red / pink / white
% Style follows the reference dihybrid Punnett square SVG:
%   gamete headers outside the grid, pastel fills by phenotype,
%   thin uniform grid on top, no in-cell annotations.
%
% 踩过的坑 (pitfalls):
% 1. standalone 文档类默认没有 \female / \male 符号宏,
%    直接使用会 COMPILE_FAILED (HTTP 422)。如需性别符号须另加载宏包。
% 2. TikZ 的 \draw ... grid 默认步长是 1cm:
%    "\draw (0,0) grid (4,-4)" 画的是 4x4 = 16 格,不是 2x2。
%    若用 grid 必须显式指定 step=2cm;
%    但 dvisvgm 转 SVG 时 grid 命令可能出现线错位/缺失,
%    故最终改用手工画外边框 + 横竖各一条内线。
% 3. 金鱼草是被子植物,配子载体是 pollen(花粉)和胚囊内的 egg cell,
%    不要用人类/动物的 sperm/egg 描述。

\definecolor{redflower}{RGB}{200,30,40}
\definecolor{pinkflower}{RGB}{240,150,170}
\definecolor{whitecell}{RGB}{255,255,255}

\begin{document}
\begin{tikzpicture}[geno/.style={font=\bfseries}]

% cell size 2cm x 2cm, grid from (0,0) to (4,-4)

% gamete headers: top = pollen (花粉), left = ovule/egg cell (胚囊内卵细胞)
\node[geno] at (1.0, 0.6) {$C^{R}$};   % pollen 1
\node[geno] at (3.0, 0.6) {$C^{W}$};   % pollen 2
\node[geno] at (-0.6,-1.0) {$C^{R}$};  % egg 1
\node[geno] at (-0.6,-3.0) {$C^{W}$};  % egg 2

% cell fills by phenotype (top-left origin)
\fill[redflower]  (0,-0)   rectangle (2,-2);   % CR x CR -&gt; RR = red
\fill[pinkflower] (2,-0)   rectangle (4,-2);   % CW x CR -&gt; RW = pink
\fill[pinkflower] (0,-2)   rectangle (2,-4);   % CR x CW -&gt; RW = pink
\fill[whitecell]  (2,-2)   rectangle (4,-4);   % CW x CW -&gt; WW = white

% genotype text centered in each cell (allele order unified: C^R before C^W)
\node at (1,-1) {\textcolor{white}{$C^{R}C^{R}$}};
\node at (3,-1) {$C^{R}C^{W}$};
\node at (1,-3) {$C^{R}C^{W}$};
\node at (3,-3) {$C^{W}C^{W}$};

% manual grid lines to avoid rendering issues with SVG/dvisvgm
\draw[line width=0.4pt] (0,0) rectangle (4,-4); % 外边框
\draw[line width=0.4pt] (0,-2) -- (4,-2);       % 横线
\draw[line width=0.4pt] (2,0) -- (2,-4);        % 竖线

\end{tikzpicture}
\end{document}
